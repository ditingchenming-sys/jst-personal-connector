<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>确认聚水潭操作</title><style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#18314c;background:#edf4fc}body{margin:0;padding:32px 20px}main{max-width:850px;margin:auto;background:white;border:1px solid #dce5f0;padding:28px;border-radius:10px}h1{font-size:23px}p{line-height:1.8}pre{white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid #dce5f0;border-radius:6px;padding:18px;background:#f5f8fd;font-size:13px;line-height:1.7}button,a{font:inherit}button{padding:12px 18px;border:0;border-radius:5px;background:#087fff;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}a{color:#0871da}#message{white-space:pre-wrap}label{display:block;margin:22px 0;line-height:1.8}[hidden]{display:none!important}
</style></head><body><main><h1>核对并确认本次操作</h1><p>确认仅适用于当前账号、这份预览和其中的具体内容。确认后回到 AI 或业务系统执行；内容变化需重新预览。</p><p id="actor"></p><pre id="preview">正在读取本人预览……</pre><label><input id="ack" type="checkbox" disabled> 我已核对完整预览，授权执行其中的操作。</label><button id="approve" disabled>确认这份预览</button><p id="message" role="status"></p><a id="login" hidden>登录本人员工账号</a></main><script>
'use strict';const $=id=>document.getElementById(id),previewId=location.pathname.split('/').pop(),connection=new URLSearchParams(location.search).get('connection');let csrf='',record=null;
async function api(path,body,method='POST'){const response=await fetch(path,{method,credentials:'same-origin',redirect:'error',headers:{'Content-Type':'application/json',...(csrf?{'X-CSRF-Token':csrf}:{})},...(method==='GET'?{}:{body:JSON.stringify(body)})});const value=await response.json();if(response.status===401){const next=location.pathname+location.search;$('login').href='/login?'+new URLSearchParams({...(connection?{connection}:{}),next}).toString();$('login').hidden=false;}if(!response.ok||value.ok===false)throw Error(value.error?.message||'预览读取失败');return value;}
async function start(){try{const user=await api('/portal/session',null,'GET');if(connection&&user.connection_id!==connection)throw Error('当前页面登录的是其他调用端，请先在连接授权页切换。');csrf=user.csrf;$('actor').textContent='员工：'+user.username+'；调用端：'+user.client;record=(await api('/portal/operation',{preview_id:previewId})).preview;$('preview').textContent=JSON.stringify(record,null,2);if(record.status==='ready'&&record.expires_at*1000>Date.now()){$('ack').disabled=false;$('message').textContent='请核对对象、内容、检查结果、有效期和执行边界。';}else $('message').textContent='预览已过期或当前状态为'+record.status+'，请重新核对，不能重复确认。';}catch(error){$('preview').textContent='';$('message').textContent=error.message;}}
$('ack').onchange=()=>{$('approve').disabled=!$('ack').checked||!record||record.status!=='ready';};$('approve').onclick=async()=>{$('approve').disabled=true;$('ack').disabled=true;try{const value=await api('/portal/approve',{preview_id:previewId,digest:record.digest});record=value.preview;$('message').textContent='已确认。请回到 AI 或业务系统执行同一预览。';}catch(error){$('message').textContent=error.message;}};start();
</script></body></html>
